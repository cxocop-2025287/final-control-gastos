<div class="login-page" (mousemove)="onMouseMove($event)">
  <!-- Panel Izquierdo con Animación de Partículas -->
  <div class="login-left" #leftPanel>
    <canvas #particleCanvas class="particle-canvas"></canvas>

    <div class="left-content">
      <img src="img/LogoTrasparente.png" alt="Logo" class="logo-img" />
      <h1 class="brand-title">Control de<br/>Gastos</h1>
      <p class="brand-subtitle">Gestione sus finanzas de forma inteligente</p>
    </div>
  </div>

  <!-- Panel Derecho Formulario -->
  <div class="login-right">
    <div class="form-container">
      <div class="form-header">
        <h2>Bienvenido</h2>
        <p>Ingrese sus credenciales para continuar</p>
      </div>

      <form class="login-form" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="name" class="form-label">Usuario</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            <input
              type="text"
              id="name"
              class="form-input"
              [(ngModel)]="name"
              name="name"
              placeholder="Su usuario"
              autocomplete="username"
              [disabled]="isLoading"
            />
          </div>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Contraseña</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input
              [type]="showPassword ? 'text' : 'password'"
              id="password"
              class="form-input"
              [(ngModel)]="password"
              name="password"
              placeholder="Su contraseña"
              autocomplete="current-password"
              [disabled]="isLoading"
            />
            <button
              type="button"
              class="toggle-password"
              (click)="togglePassword()"
              [disabled]="isLoading"
            >
              <svg *ngIf="!showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg *ngIf="showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="error-message" *ngIf="errorMessage">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <line x1="15" y1="9" x2="9" y2="15"/>
            <line x1="9" y1="9" x2="15" y2="15"/>
          </svg>
          <span>{{ errorMessage }}</span>
        </div>

        <div class="success-message" *ngIf="successMessage">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
            <polyline points="22 4 12 14.01 9 11.01"/>
          </svg>
          <span>{{ successMessage }}</span>
        </div>

        <button type="submit" class="btn-login" [disabled]="isLoading">
          <span *ngIf="!isLoading">Iniciar Sesión</span>
          <span *ngIf="isLoading" class="loading-content">
            <span class="spinner"></span>
            Ingresando...
          </span>
        </button>

        <div class="divider">
          <span>O</span>
        </div>

        <div id="google-btn-container" class="google-btn-container"></div>
      </form>

      <div class="login-footer">
        <p>2026 Control de Gastos</p>
      </div>
    </div>
  </div>
</div>
